services:
  - type: web
    name: trialmatch-api
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    branch: integration/final-app
    buildCommand: python -m pip install .
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --log-level info
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: TRIALMATCH_ENV
        value: production
      - key: TRIALMATCH_DATABASE_URL
        value: sqlite:////var/data/trialmatch.sqlite3
      - key: TRIALMATCH_SITE_EXPORT_PATH
        value: backend/data/exports/ma_trial_sites.json
      - key: CLINICALTRIALS_API_BASE_URL
        value: https://clinicaltrials.gov/api/v2
      - key: CLINICALTRIALS_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: CLINICALTRIALS_MAX_RETRIES
        value: "3"
      - key: CLINICALTRIALS_CACHE_DIR
        value: /var/data/cache/clinicaltrials
      - key: LLM_PROVIDER
        value: disabled
    disk:
      name: trialmatch-data
      mountPath: /var/data
      sizeGB: 1
